#spring.config.import=optional:file:.env[.properties]
# servlet context path
server.undertow.url-charset=UTF-8
server.forward-headers-strategy=FRAMEWORK
server.tomcat.internal-proxies=192\\.168\\.\\d{1,3}\\.\\d{1,3}
server.port=${SERVER_PORT:8080}
spring.application.name=commerce-platform
server.servlet.contextPath=/normdevstorm
#Database configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.org.springframework.web=debug
logging.level.org.hibernate=info
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.enabled=true
springdoc.swagger-ui.oauth.app-name=Commerce
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.access-token-expiration-time= 900000
security.jwt.refresh-token-expiration-time= 10080000
spring.jackson.serialization.fail-on-empty-beans=false

#mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#paypal configuration
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
#for development mode (not real payments). Value 'live' for production
paypal.mode=sandbox
application.paypal.success_url=http://localhost:8081/normdevstorm/payment/success
application.paypal.cancel_url=http://localhost:8081/normdevstorm/payment/cancel
server.address=0.0.0.0





